# ═══════════════════════════════════════════════════════════════════════
# ast-grep RULE — DETECTION of a PATH CONSTRUCTION. NO POLICY HERE.
# ═══════════════════════════════════════════════════════════════════════
#
# 🛑 STRICT SEPARATION, DO NOT BLUR IT: this file DETECTS every assembled
#    path; WHICH assembly is forbidden, and WHO is allowed to make it, lives
#    in `test/fleet-hooks-path.test.js`. Adding an `ignores:`/`files:` here
#    would hide a call site from the gate — an exemption nobody would ever
#    read again, in the one place where nobody is looking.
#
# ⚠️ AST, NEVER REGEX, and it is load-bearing HERE more than anywhere. The
#    files this rule scans DOCUMENT the forbidden form on purpose:
#    `src/paths.js` carries "NEVER rebuild it with
#    `path.join(os.homedir(), '.claude', 'hooks')`" in a comment, and
#    `src/vendor-deadline.js` and `tools/lint-corpus.js` each explain the
#    defect they were cured of. A regex would accuse the very documentation
#    that protects the invariant, and a gate that accuses its own docs gets
#    disarmed the same day.
#
# ⚠️ KEYED ON THE METHOD, NEVER ON THE RECEIVER — the lesson already paid in
#    `rules/fs-call.yml` on 2026-08-21: `require('path').join(...)` and a
#    local alias both went GREEN against a receiver-anchored atom, i.e. the
#    detector went SILENT, i.e. fail-OPEN. `join`/`resolve` are matched bare
#    AND behind any receiver, so no import shape can hide a construction.
#
# ⚠️ THIS RULE MATCHES EVERY PATH JOIN, INCLUDING INNOCENT ONES, AND THAT IS
#    THE DESIGN. It does not decide anything; the gate keeps only the matches
#    whose text carries EVERY SEGMENT OF ONE OF THE HARNESS ROOTS, and those
#    segments are DERIVED from `paths.harnessRoots()` itself — never typed
#    here. Move a root's segments tomorrow, or declare a new root, and the
#    detector follows on its own; a segment written into this file would be a
#    second copy of the one truth the whole work item exists to remove.
#
# 🔑 THE CLASS IS "A HARNESS ROOT REBUILT BY HAND", NEVER "the hooks root"
#    (widened 2026-08-21). Naming one directory would have left its siblings
#    open to the identical defect — and one of them was still open when this
#    file was written: `tools/scope-reach.js` assembled the TRANSCRIPT corpus
#    `~/.claude/projects` from `os.homedir()`, with no env var at all. Same
#    shape, same silence, different second segment.
#
# ⚠️ EVERY `pattern:` BELOW IS AN ATOM and the gate DERIVES its witness table
#    from this list: an atom added tomorrow stays RED until a real line of
#    code proves it detects something. Never add an atom without its witness.
#
# ⚠️ DECLARED BLIND CELLS, WITH THEIR TRUE FAILURE DIRECTION — SILENCE, i.e.
#    fail-OPEN, never a red. A root assembled inside a TEMPLATE LITERAL
#    (`${home}/.claude/hooks`, `${home}/.claude/projects`), through a
#    third-party path helper, or from segments held in variables named nowhere
#    near the literal, carries no atom here and the gate says NOTHING. Widening
#    the class to every harness root did NOT change that direction: the new
#    roots are blind in exactly the same shapes as the first one. Stated rather
#    than papered over: a blind cell written as if it failed closed tells the
#    next reader the case is handled, which is worse than saying nothing.
id: fleet-root-build
language: JavaScript
severity: error
message: >-
  PATH CONSTRUCTION — if it re-assembles a HARNESS ROOT (the hook fleet, the
  transcript corpus, the skill store), it is a SECOND definition of a root
  `src/paths.js` already owns. A component is never designated by a GUESSED
  address: two copies of one path diverge in silence, and the copy that rots
  is never the one you are looking at. Use the accessor —
  `paths.fleetHooksDir()` / `paths.transcriptsDir()` / `paths.skillsDir()` to
  REACH the disk (absolute, overridable), and for the fleet root ONLY,
  `paths.fleetHooksLabel()` to SHOW an address to a reader (relative,
  home-free, because this repository is public and its `[source: …]` tag
  travels inside every injected document).
rule:
  any:
    - pattern: join($$$)
    - pattern: $X.join($$$)
    - pattern: resolve($$$)
    - pattern: $X.resolve($$$)
    - pattern: $A + $B
