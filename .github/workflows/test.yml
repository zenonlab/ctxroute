name: test

on:
  # ⚠️ MANUAL TRIGGER — added 2026-08-21. The push triggers are branch-bound
  #    ([main, master]) on purpose: quota. But a work branch then has NO judge at
  #    all, and the three-OS matrix is the only thing that can see a Linux or
  #    macOS defect. Dispatch gives that verdict WITHOUT deploying anything.
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # ⚠️ `npm ci` MANDATORY here: the suite depends on fast-check
      # (lib-pure.property.test.js). This job used to run without an install
      # while the tests were zero-dep — forgetting it = red CI on all 3 OSes
      # for a reason invisible locally (node_modules already present).
      - run: npm ci
      # 🛑 CI RUNS **EVERYTHING** (`test:all` = both projects). `npm test` is the
      #    FAST lane of the edit loop (~2 s) — using it here would deprive CI of
      #    the spawning suites, i.e. the only ones proving the hooks REALLY run.
      #    The staging is in TIME, never in the proof.
      # ⚠️ THE COMMAND BELOW IS THE ONLY LOGIC THIS JOB CARRIES (CLAUDE.md
      #    §Tests&CI, 2026-08-29): the real steps live in `src/ci-steps-pure.js`
      #    (group `unit`), executed by `tools/ci.mjs`. Never edit the command
      #    here — edit CI_STEPS, `test/ci-steps-gate.test.js` reddens on drift.
      - run: npm run ci:unit

  coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ㉑ (16/08/2026): tsc --checkJs — the checker, never the syntax.
      # Binary ratchet: 0 errors, reached on 16/08/2026 (95 fixed, 0 runtime bugs).
      # ⚠️ THE COMMAND BELOW IS THE ONLY LOGIC THIS JOB CARRIES (CLAUDE.md
      #    §Tests&CI, 2026-08-29): the real steps (check:types then
      #    check:coupling) live in `src/ci-steps-pure.js` (group `coupling`),
      #    executed by `tools/ci.mjs`. Never edit the command here — edit
      #    CI_STEPS, `test/ci-steps-gate.test.js` reddens on drift.
      - run: npm run ci:coupling

# ⚠️ MUTATION LIVES IN `.github/workflows/mutation.yml`, NOT HERE.
#    Reason: `paths:` applies to the WHOLE workflow, never to a job — keeping
#    it here would run it on EVERY push (235-296 s measured), including doc
#    commits. Doctrine: "HEAVY job (> ~3 min) → SEPARATE workflow with strict
#    paths". (This repo is PUBLIC, so minutes are unlimited — the separation
#    still holds for feedback time, not for quota. Becomes a quota concern
#    again if the repo ever goes private.)
#    ⚠️ Do NOT re-add it here: it would run TWICE, and the other workflow's
#    `paths` filter would become decorative.
#    The paths ⟷ stryker.conf.json mirror is sealed by
#    `mutation-workflow-gate.test.js`.
