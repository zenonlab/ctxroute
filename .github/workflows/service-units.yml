# ═══════════════════════════════════════════════════════════════════════
# THE THREE OS UNITS, LOADED BY A REAL SUPERVISOR.
# ═══════════════════════════════════════════════════════════════════════
#
# 🔑 WHY THIS WORKFLOW EXISTS. Until it, `service/` was three files that had
#    never been loaded by anything: correct against the documentation, never
#    against a machine — the state this repository considers the worst a
#    guardrail can be in, because it CERTIFIES instead of protecting. We own no
#    Mac and no Linux desktop; GitHub RENTS a real launchd, a real systemd and a
#    real Task Scheduler by the minute. That is the whole idea.
#
# 🛑 WHAT NO RUNNER CAN EVER PROVE — declared, never simulated:
#    · the LOGON trigger (systemd `WantedBy=sockets.target`, launchd `RunAtLoad`,
#      the task's `LogonTrigger`): a runner starts the job from a session that
#      already exists and never performs a fresh interactive logon;
#    · surviving a REBOOT, and coming back with the machine;
#    · surviving SLEEP / WAKE, which is where the Windows battery flags and
#      `ExecutionTimeLimit` would show;
#    · the exit-90 restart PATH END TO END (a code change, the daemon standing
#      down, the supervisor bringing it back) — it needs a live edit of the
#      running clone, and on Windows a real event 201.
#    Everything above stays in `service/README.md` under "what could NOT be
#    verified". A green here means "the unit is ACCEPTED and the daemon ANSWERS",
#    never "the unit is proven".
#
# 🛑 ZERO PROCEDURE IS WRITTEN HERE. Every command below calls the installer of
#    its OS (`service/install-*.{sh,ps1}`) — the single place each procedure
#    lives, the same one the README points to and an adopter runs by hand. A
#    `systemctl`/`launchctl`/`Register-ScheduledTask` line copied into this file
#    would be a second truth, and CI would keep proving the copy while people ran
#    the original.
#
# ⚠️ TRI-STATE, AND IT IS THE POINT OF THE `code -eq 78` BRANCHES. An installer
#    exits 78 (sysexits EX_CONFIG) when the RUNNER cannot host the measurement —
#    no systemd user bus, no launchd domain, no elevation for the event channel.
#    That is NOT a defect of the unit and it is NEVER a silent pass: the job
#    fails LOUDLY and names the missing precondition, so nobody can mistake
#    "we could not judge" for "we judged and it was fine".
# ═══════════════════════════════════════════════════════════════════════
name: service-units

on:
  workflow_dispatch:
  # ⚠️ STRICT `paths:` IS WHAT MAKES THIS JOB PAYABLE. A macOS runner bills at
  #    ×10 the Actions minutes (Windows ×2, Linux ×1); running this on every
  #    push would be the quota mistake. It fires only when a unit, an installer
  #    or the daemon's entry point actually moves.
  push:
    paths:
      - 'service/**'
      - 'src/hooks/http-server.js'
      - 'src/hooks/http-daemon.js'
      - 'src/stale-code.js'
      - 'src/stale-code-pure.js'
      - '.github/workflows/service-units.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ⚠️ PRECONDITION, NOT A PROOF. `systemctl --user` needs a per-user manager
      #    and a session bus; a runner account has neither until lingering is
      #    enabled. Arming it here keeps the installer free of any CI-ism — and
      #    if it does not take, the installer says so with 78 instead of
      #    pretending to have judged the units.
      - name: arm the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: load the units through systemd
        shell: bash
        run: |
          set +e
          sh service/install-linux.sh install | tee install.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 78 ]; then
            echo "::error::PRECONDITION NOT MET on this runner — the systemd units were NOT judged. Read the message above; this is not a verdict about the units."
            exit 1
          fi
          [ "$code" -eq 0 ] || exit "$code"
          # ⚠️ `tr -d '\r'`: a PowerShell installer writes CRLF, and a carriage
          #    return glued to the port would build a malformed URL — a failure
          #    that reads like "the daemon never answered". Harmless elsewhere.
          echo "CTXROUTE_PORT=$(sed -n 's/^ctxroute-port=//p' install.log | tr -d '\r' | tail -n 1)" >> "$GITHUB_ENV"

      # ⚠️ THE ANSWER IS THE PROOF — a real POST, never "a node process exists".
      #    On Linux this also exercises socket activation itself: systemd holds
      #    the socket and THIS request is what starts the instance.
      - run: sh service/verify-responds.sh "$CTXROUTE_PORT"
        shell: bash

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: load the agent through launchd
        shell: bash
        run: |
          set +e
          sh service/install-macos.sh install | tee install.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 78 ]; then
            echo "::error::PRECONDITION NOT MET on this runner — no reachable launchd domain, or no C compiler for the socket shim. The agent was NOT judged. Read the message above; this is not a verdict about the plist."
            exit 1
          fi
          [ "$code" -eq 0 ] || exit "$code"
          # ⚠️ `tr -d '\r'`: a PowerShell installer writes CRLF, and a carriage
          #    return glued to the port would build a malformed URL — a failure
          #    that reads like "the daemon never answered". Harmless elsewhere.
          echo "CTXROUTE_PORT=$(sed -n 's/^ctxroute-port=//p' install.log | tr -d '\r' | tail -n 1)" >> "$GITHUB_ENV"
          # ⚠️ The launchd TARGET is derived from the installer too, never rebuilt
          #    here: the domain is a parameter the machine decides, so a second
          #    place composing `gui/<uid>/<label>` would diverge the day a host
          #    only exposes `user/<uid>`.
          echo "CTXROUTE_TARGET=$(sed -n 's/^ctxroute-launchd-target=//p' install.log | tr -d '\r' | tail -n 1)" >> "$GITHUB_ENV"

      # ⚠️ THE SUPERVISOR IS NO LONGER EAGER — `RunAtLoad`/`KeepAlive` left the
      #    plist when launchd took ownership of the socket. Nothing is running at
      #    this point, and THIS REQUEST is what starts the first instance. That
      #    is already socket activation working, before the window proof below.
      - run: sh service/verify-responds.sh "$CTXROUTE_PORT"
        shell: bash

      # ═══════════════════════════════════════════════════════════════════
      # 🔑 THE PROOF THE WHOLE macOS SHIM WAS WRITTEN FOR.
      # ═══════════════════════════════════════════════════════════════════
      # "It launches" was never the question: the eager model launched too, and
      # lost every injection arriving between a stale-code exit and the respawn.
      # This kills the daemon and requires that a request issued while NOTHING
      # is running be SERVED — queued in the backlog of a socket launchd still
      # owns, then answered by a fresh instance the connection itself started.
      # It carries its own control cell (a refusal must be reportable) so it
      # cannot pass while measuring nothing.
      - name: PROVE THE WINDOW IS CLOSED — a request served while nothing runs
        shell: bash
        run: sh service/verify-window.sh "$CTXROUTE_PORT" "$CTXROUTE_TARGET"

      # 🔴 DIAGNOSTIC, NOT A PROOF — added 2026-08-21 after a first run where
      #    launchd reported `state = running`, `pid = 6105`, `never exited` AND
      #    nothing was listening on the port. The process was ALIVE and NOT
      #    LISTENING, and the plist deliberately captures no `stderr` (a plist log
      #    file is never rotated). We were therefore BLIND.
      # ⚠️ An unobservable failure costs one CI round trip PER HYPOTHESIS — the
      #    lesson is already engraved in this repository; it pays for itself here.
      # 🛑 IT MUST RUN BEFORE THE UNINSTALL. It was placed after an `if: always()`
      #    uninstall until 2026-08-23, so every question it asked was asked of an
      #    agent that had just been booted out — `launchctl print` on a label that
      #    no longer exists is indistinguishable from a step that was never there.
      - name: diagnose — why did it not answer
        if: failure()
        shell: bash
        run: |
          echo "--- launchd view of the agent ---"
          launchctl print "${CTXROUTE_TARGET:-gui/$(id -u)/com.ctxroute.http}" 2>&1 | head -60 || true
          echo "--- the installed plist ---"
          cat "$HOME/Library/LaunchAgents/com.ctxroute.http.plist" || true
          echo "--- what the shim and the daemon said to the unified log ---"
          log show --last 10m --style compact \
            --predicate 'process == "launchd-socket-shim" OR process == "node"' 2>&1 | tail -60 || true
          echo "--- the daemon, in the foreground, stderr captured ---"
          node src/hooks/http-daemon.js > fg.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            curl -s -o /dev/null --max-time 2 "http://127.0.0.1:${CTXROUTE_PORT:-8787}/" && break
            kill -0 "$pid" 2>/dev/null || break
          done
          kill "$pid" 2>/dev/null || true
          echo "--- its output ---"; cat fg.log || true

      - name: uninstall before the negative-check
        shell: bash
        run: sh service/install-macos.sh uninstall

      # ═══════════════════════════════════════════════════════════════════
      # 🛑 SEEN RED — the shim's pid comparison, sabotaged, MUST break the lane.
      # ═══════════════════════════════════════════════════════════════════
      # 🔑 THIS IS WHY THE SHIM WAS ALLOWED TO BE WRITTEN AT ALL. It was refused
      #    for months on one ground: no session here can load a launchd unit (the CI runner can, and the associate's Mac is a LIVE target), so it
      #    could never be SEEN RED, and shipping a guardrail that has never
      #    failed is shipping something that CERTIFIES instead of protecting.
      #    This runner removes that ground, so the obligation applies in full.
      #
      # 📐 WHAT IS SABOTAGED, AND WHY THAT LINE. sd_listen_fds(3) requires the
      #    daemon to check "whether the $LISTEN_PID environment variable equals
      #    the daemon PID. If not, it returns immediately" — because these are
      #    ORDINARY environment variables and are therefore INHERITED. Publishing
      #    a parent's pid instead of our own is exactly the defect that check
      #    exists to catch, and it is invisible in every process listing.
      # ⇒ node then refuses the descriptor, falls back to binding the port
      #    itself, finds launchd already holding it, and dies on EADDRINUSE.
      #
      # 🛑 THE SABOTAGE IS A COPY IN THE TMPDIR, NEVER AN EDIT IN PLACE. A crash
      #    mid-job must not leave this repository holding a broken shim, and no
      #    sabotage switch may exist in the tracked source: a broken build has to
      #    be impossible to ship, not merely discouraged.
      - name: SEEN RED — sabotage the pid comparison and require this to fail
        shell: bash
        run: |
          SAB="$RUNNER_TEMP/launchd-socket-shim-sabotaged.c"
          sed 's/(long)getpid()/(long)getppid()/' service/launchd-socket-shim.c > "$SAB"

          # ⚠️ ANTI-VACUITY, FIRST. A `sed` that matched nothing exits 0 and
          #    produces a PERFECT copy — the job would then "prove" a red it never
          #    caused, which is the same lie as a green that measured nothing.
          if cmp -s service/launchd-socket-shim.c "$SAB"; then
            echo "::error::THE SABOTAGE CHANGED NOTHING. The pattern no longer matches the shim's source, so the negative-check below would pass on an INTACT binary and certify a red it never produced. Fix the pattern, not the shim."
            exit 1
          fi
          echo "--- the sabotaged line ---"
          diff service/launchd-socket-shim.c "$SAB" || true

          CTXROUTE_SHIM_SOURCE="$SAB" sh service/install-macos.sh install > sabotage-install.log 2>&1
          echo "--- installer output ---"; cat sabotage-install.log

          # ⚠️ SHORT BOUND ON PURPOSE: we EXPECT no answer, and the honest failure
          #    here is fast (the daemon dies on EADDRINUSE the moment it starts).
          #    Waiting the full default would only make a known-red step slow.
          set +e
          CTXROUTE_VERIFY_ATTEMPTS=10 CTXROUTE_VERIFY_TIMEOUT=5 \
            sh service/verify-responds.sh "$CTXROUTE_PORT" > sabotage-verify.log 2>&1
          rc=$?
          set -e
          echo "--- RAW OUTPUT of the sabotaged run (exit $rc) ---"
          cat sabotage-verify.log
          echo "--- what the sabotaged daemon said to the unified log ---"
          log show --last 5m --style compact \
            --predicate 'process == "launchd-socket-shim" OR process == "node"' 2>&1 | tail -40 || true

          if [ "$rc" -eq 0 ]; then
            echo "::error::THE SABOTAGED SHIM STILL SERVED THE LANE. Publishing somebody else's pid in LISTEN_PID was supposed to make the daemon refuse the inherited descriptor. It did not, which means the pid comparison is NOT what makes this work — this whole macOS proof is measuring something other than socket activation. Do not ship until this step goes red."
            exit 1
          fi
          echo "SEEN RED — the sabotaged pid comparison broke the lane exactly as the protocol says it must."

      # ⚠️ Always, even on failure: a runner is thrown away, but an installer
      #    that cannot undo itself is an installer nobody dares run twice.
      - if: always()
        run: sh service/install-macos.sh uninstall
        shell: bash


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ⚠️ Driven from bash so the 78 branch is written ONCE per job in the same
      #    form as the other two — the installer itself is PowerShell, as an
      #    operator would run it. `-File` keeps the script's own exit code.
      - name: register the task through Task Scheduler
        shell: bash
        run: |
          set +e
          powershell -NoProfile -ExecutionPolicy Bypass -File service/install-windows.ps1 -Action install | tee install.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 78 ]; then
            echo "::error::PRECONDITION NOT MET on this runner — the Operational channel could not be enabled, so the task was NOT judged. Read the message above."
            exit 1
          fi
          [ "$code" -eq 0 ] || exit "$code"
          # ⚠️ `tr -d '\r'`: a PowerShell installer writes CRLF, and a carriage
          #    return glued to the port would build a malformed URL — a failure
          #    that reads like "the daemon never answered". Harmless elsewhere.
          echo "CTXROUTE_PORT=$(sed -n 's/^ctxroute-port=//p' install.log | tr -d '\r' | tail -n 1)" >> "$GITHUB_ENV"

      - run: sh service/verify-responds.sh "$CTXROUTE_PORT"
        shell: bash

      # ⚠️ ON FAILURE, ASK THE SUPERVISOR WHAT IT DID — `LastTaskResult` tells a
      #    task that RAN AND EXITED apart from one that never started (a runner
      #    with no interactive session cannot honour `InteractiveToken`). Without
      #    it, "no answer" would be one undifferentiated failure and the next
      #    reader would guess.
      - if: failure()
        shell: powershell
        run: Get-ScheduledTask -TaskName 'ctxroute-http' | Get-ScheduledTaskInfo | Format-List

      - if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File service/install-windows.ps1 -Action uninstall
