  push:
    branches: [main, master]
    paths:
      # AUTO:mutation-scope — GENERATED by tools/mutation-scope.js from stryker.conf.json `mutate` and vitest.stryker.config.mjs `include`. NEVER edit by hand: node tools/mutation-scope.js --write
