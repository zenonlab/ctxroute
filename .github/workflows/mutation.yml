concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # ⚠️ Node ≥22 required (dependency-cruiser demands it). A mismatch
          #    with the dev machine IS the most likely bug if this job fails
          #    in CI but passes locally (already lived through on 15/07/2026).
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠️ THE COMMAND BELOW IS THE ONLY LOGIC THIS JOB CARRIES (CLAUDE.md
      #    §Tests&CI, 2026-08-29): the real steps (test:mutation THEN the
      #    per-file mutation floor) live in `src/ci-steps-pure.js` (group
      #    `mutation`), executed by `tools/ci.mjs`. Never edit them here —
      #    edit CI_STEPS, `test/ci-steps-gate.test.js` reddens on drift.
      # ⚠️ THE PER-FILE FLOOR MUST RUN **HERE**, never only in the `test` job
      #    (14/08/2026). `mutation-floor-gate` is SILENT without
      #    `reports/mutation.json` — INTENDED behavior locally, but the report
      #    only exists in THIS job: anywhere else the gate was INERT.
      # 🔴 MEASURED: `docfacts.js` at 81.19% with 15 survivors, GREEN CI, because
      #    `thresholds.break` is an AVERAGE (99.05 global). That is the exact
      #    collapse this gate exists to prevent — invisible for a month.
      # ⚠️ `tools/ci.mjs` runs EVERY step of a group to the end regardless of an
      #    earlier failure (never stops at the first red) — that is what plays
      #    the role the old `if: always()` played here: a Stryker red on the
      #    GLOBAL threshold must not mask the PER-FILE verdict, both
      #    diagnostics, never one instead of the other. 🛑 NEVER "fix" a red
      #    here by lowering the floor: a survivor gets KILLED or ELIMINATED.
      - run: npm run ci:mutation
