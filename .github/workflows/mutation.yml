# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
# MUTATION â€” SEPARATE workflow, STRICT paths
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
#
# âš ï¸ WHY SEPARATE FROM test.yml: `paths:` applies to the WHOLE workflow,
#    never to a job. Mutation (235-296 s measured) therefore ran on EVERY
#    push â€” including doc or README commits. Doctrine: "HEAVY job (> ~3 min)
#    AND non-incremental â†’ NEVER per-push under a wide path â†’ SEPARATE
#    workflow with strict paths". Private repo = 2000 min/month.
#
# âš ï¸ `paths` MUST remain the EXACT MIRROR of `stryker.conf.json`:
#      - a `mutate` file missing here  â†’ it is mutated but the job NEVER
#        triggers for it = SILENT loss of coverage;
#      - a covering suite missing â†’ a test change that breaks the score
#        would be seen by nobody.
#    âš ï¸ TWO TRUTHS TO KEEP IN SYNC = the very bug class this repo fights.
#    Hence the `mutation-workflow-gate.test.js` gate: it reddens on the first
#    drift. NEVER edit this `paths` block without re-running it.
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

name: mutation

on:
  push:
    branches: [main, master]
    paths:
      # â”€â”€ mutated modules (mirror of stryker.conf.json `mutate`) â”€â”€
      - 'src/lib-pure.js'
      - 'src/canary.js'
      - 'src/commit-msg-lang.js'
      - 'src/commit-msg-leak.js'
      - 'src/docfacts.js'
      - 'src/scope-reach-pure.js'
      - 'src/derived-observables.js'
      - 'src/stale-code-pure.js'
      - 'src/sources/file.js'
      - 'src/sources/tool.js'
      - 'src/sources/mcp.js'
      - 'src/sources/session.js'
      - 'src/sources/skill.js'
      - 'src/frontmatter.js'
      - 'src/loader.js'
      - 'src/lint.js'
      - 'src/collisions.js'
      - 'src/gate.js'
      - 'src/deps-criticality-pure.js'
      - 'src/budget.js'
      - 'src/harness-conformance.js'
      - 'src/temporal-budget-pure.js'
      - 'src/disk-writers-pure.js'
      - 'src/doctor-wiring-pure.js'
      - 'src/quadratic-budget-pure.js'
      - 'src/rendezvous-budget-pure.js'
      - 'src/state-entry-rebuild-pure.js'
      - 'src/foreign-identifier-pure.js'
      - 'src/model-twin-pure.js'
      - 'src/declared-paths-pure.js'
      - 'src/protocol-routes-pure.js'
      - 'src/memory-store-pure.js'
      - 'src/state-crdt-pure.js'
      - 'src/state-eviction-pure.js'
      - 'src/kernel-endpoint.js'
      - 'src/differential-normalize.js'
      - 'src/wiring-plan.js'
      - 'src/wiring-dialect.js'
      - 'src/corpus-cache.js'
      - 'src/lifecycle-log-pure.js'
      - 'src/frame-sequencer-pure.js'
      - 'src/delivery-notice-pure.js'
      - 'src/freshness-scope-pure.js'
      - 'src/carryover-pure.js'
      # â”€â”€ deterministic suites covering the mutated modules (vitest perTest runner) â”€â”€
      - 'test/harness-conformance.test.js'
      - 'test/lib-pure.test.js'
      - 'test/canary.test.js'
      - 'test/commit-msg-lang.test.js'
      - 'test/commit-msg-leak.test.js'
      - 'test/sources-file.test.js'
      # `keys` operator (19/08/2026): launched by Stryker, so a change to it can move the
      # score â€” the workflow must therefore see it. Sealed by mutation-workflow-gate.
      - 'test/keys-operator.test.js'
      - 'test/operator-consumption-gate.test.js'
      - 'test/observable-reach-gate.test.js'
      - 'test/spec-differential.test.js'
      - 'src/language-spec.js'
      - 'src/cadence-spec.js'
      - 'test/cadence-differential.test.js'
      - 'test/sources-tool.test.js'
      - 'test/sources-mcp.test.js'
      - 'test/sources-session.test.js'
      - 'test/sources-skill.test.js'
      - 'test/frontmatter.test.js'
      - 'test/loader.test.js'
      - 'test/lint.test.js'
      - 'test/collisions.test.js'
      - 'test/gate.test.js'
      - 'test/deps-criticality-pure.test.js'
      - 'test/budget.test.js'
      - 'test/docfacts.test.js'
      - 'test/scope-reach-pure.test.js'
      - 'test/derived-observables.test.js'
      - 'test/stale-code-pure.test.js'
      - 'test/temporal-budget-pure.test.js'
      - 'test/disk-writers-pure.test.js'
      - 'test/doctor-wiring-pure.test.js'
      - 'test/quadratic-budget-pure.test.js'
      - 'test/rendezvous-budget-pure.test.js'
      - 'test/state-entry-rebuild-pure.test.js'
      - 'test/foreign-identifier-pure.test.js'
      - 'test/model-twin-pure.test.js'
      - 'test/declared-paths-pure.test.js'
      - 'test/protocol-routes-pure.test.js'
      - 'test/frame-sequencer-pure.test.js'
      - 'test/delivery-notice-pure.test.js'
      - 'test/freshness-scope.test.js'
      - 'test/carryover-pure.test.js'
      - 'test/memory-store.test.js'
      - 'test/state-eviction-pure.test.js'
      - 'test/state-crdt-pure.test.js'
      - 'test/kernel-endpoint.test.js'
      - 'test/differential-normalize.test.js'
      - 'test/wiring-plan.test.js'
      - 'test/wiring-plan-splice.test.js'
      - 'test/wiring-dialect.test.js'
      - 'test/corpus-cache.test.js'
      - 'test/lifecycle-log-pure.test.js'
      # â”€â”€ the mutation config itself + the deps â”€â”€
      - 'stryker.conf.json'
      - 'vitest.stryker.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mutation.yml'
  pull_request:
  # âš ï¸ Safety net: allows a manual re-run when in doubt (e.g. after a tooling
  #    change that touches none of the paths above).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # âš ï¸ Node â‰¥22 required (dependency-cruiser demands it). A mismatch
          #    with the dev machine IS the most likely bug if this job fails
          #    in CI but passes locally (already lived through on 15/07/2026).
          node-version: 22
          cache: npm
      - run: npm ci
      # âš ï¸ THE COMMAND BELOW IS THE ONLY LOGIC THIS JOB CARRIES (CLAUDE.md
      #    Â§Tests&CI, 2026-08-29): the real steps (test:mutation THEN the
      #    per-file mutation floor) live in `src/ci-steps-pure.js` (group
      #    `mutation`), executed by `tools/ci.mjs`. Never edit them here â€”
      #    edit CI_STEPS, `test/ci-steps-gate.test.js` reddens on drift.
      # âš ï¸ THE PER-FILE FLOOR MUST RUN **HERE**, never only in the `test` job
      #    (14/08/2026). `mutation-floor-gate` is SILENT without
      #    `reports/mutation.json` â€” INTENDED behavior locally, but the report
      #    only exists in THIS job: anywhere else the gate was INERT.
      # ðŸ”´ MEASURED: `docfacts.js` at 81.19% with 15 survivors, GREEN CI, because
      #    `thresholds.break` is an AVERAGE (99.05 global). That is the exact
      #    collapse this gate exists to prevent â€” invisible for a month.
      # âš ï¸ `tools/ci.mjs` runs EVERY step of a group to the end regardless of an
      #    earlier failure (never stops at the first red) â€” that is what plays
      #    the role the old `if: always()` played here: a Stryker red on the
      #    GLOBAL threshold must not mask the PER-FILE verdict, both
      #    diagnostics, never one instead of the other. ðŸ›‘ NEVER "fix" a red
      #    here by lowering the floor: a survivor gets KILLED or ELIMINATED.
      - run: npm run ci:mutation
